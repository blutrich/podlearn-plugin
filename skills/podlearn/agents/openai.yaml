# Codex/ChatGPT-native skill metadata (D-3). Additive: Claude Code ignores this
# file entirely — SKILL.md remains the single source of truth for both clients
# (fact 5 in specs/2026-07-31-mcp-skill-codex/requirements.md: Codex 0.144.5
# loads the Claude-format plugin manifest and this SKILL.md verbatim). Shape
# matches OpenAI's real, shipped example
# (specs/2026-07-31-mcp-skill-codex/samples/codex-agents-openai-yaml-example.yaml)
# and specs/2026-07-31-mcp-skill-codex/samples/openai-plugins-build-skills.md.
#
# License note (D-8): this skill is distributed via
# https://github.com/blutrich/podlearn-plugin under GNU AGPL-3.0 — the network
# clause applies to modified network deployments of the PodLearn service, not
# to using this skill/MCP client-side.

interface:
  display_name: "PodLearn"
  short_description: "Research podcasts and YouTube with cited transcripts"
  default_prompt: "Use PodLearn MCP to search and read cited transcripts. Prefer OAuth at the canonical endpoint; request write consent when needed. Before any of the four paid tools, reuse existing content and honor or obtain bounded spending authorization. Never invent tool results."

dependencies:
  tools:
    - type: "mcp"
      value: "podlearn"
      description: "PodLearn MCP server — 25 tools: search 4M+ podcasts + YouTube, transcribe any episode/video URL, full-text transcript search, AI lessons, LinkedIn post generation"
      transport: "streamable_http"
      url: "https://podlearn.ai/mcp"
